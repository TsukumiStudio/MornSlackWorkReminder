<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: Tahoma, "MS UI Gothic", "Hiragino Sans", sans-serif; color: #000; font-size: 12px; line-height: 1.5; -webkit-user-select: none; cursor: default; }
  * { box-sizing: border-box; }
  .veil { position: fixed; inset: 0; display: grid; place-items: center; background: #0008; }
  .window { grid-area: 1 / 1; position: relative; width: min(460px, calc(100vw - 96px)); max-height: calc(100vh - 96px); overflow: auto; background: #ece9d8; border: 3px solid #0054e3; border-top: 0; border-radius: 8px 8px 0 0; box-shadow: inset 1px 0 #fff8, 7px 9px 22px #0006; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 31px; color: white; background: linear-gradient(#3689ff 0%, #0865ed 12%, #0055e5 55%, #0050d6 90%, #003db5 100%); padding: 3px 3px 4px 7px; font-size: 13px; font-weight: bold; text-shadow: 1px 1px #003b99; box-shadow: inset 0 1px #70b6ff; }
  .title { display: flex; align-items: center; gap: 6px; }
  .app-icon { width: 15px; height: 14px; border: 1px solid #fff; background: linear-gradient(#2c6ed5 0 25%, #ece9d8 25%); box-shadow: 1px 1px #003b99; }
  button { font: inherit; color: #000; background: linear-gradient(#fff, #f0f0e7 55%, #dedac6); border: 1px solid #003c74; border-radius: 3px; min-width: 82px; min-height: 26px; padding: 3px 16px; box-shadow: inset 1px 1px #fff; cursor: pointer; }
  button:hover { box-shadow: inset 0 0 0 2px #f4c36b; }
  button:active { background: #dedac6; box-shadow: inset 1px 1px 2px #0003; }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .close { display: grid; place-items: center; flex: 0 0 22px; min-width: 22px; min-height: 22px; height: 22px; padding: 0; color: #fff; border: 1px solid #fff; background: linear-gradient(135deg, #f9b197, #e65a39 45%, #c83010); box-shadow: inset 1px 1px #fff6; font: bold 22px/1 Arial, sans-serif; text-shadow: 1px 1px #8e1c07; }
  .close:hover { background: linear-gradient(135deg, #ffd4bb, #f46b49 45%, #e33d18); }
  main { display: flex; align-items: flex-start; gap: 20px; padding: 27px 24px 14px; }
  .icon { position: relative; display: block; flex: 0 0 34px; height: 34px; margin-top: 3px; background: radial-gradient(circle at 30% 25%, #ff8a83, #e4271b 50%, #ab0f04 95%); border: 1px solid #a91c12; border-radius: 50%; box-shadow: inset 1px 1px 2px #fff9, 1px 2px 2px #0004; }
  .icon::before, .icon::after { content: ""; position: absolute; top: 7px; left: 13px; width: 5px; height: 19px; background: #fff; border-radius: 1px; transform: rotate(45deg); }
  .icon::after { transform: rotate(-45deg); }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: bold; }
  p { font-size: 12px; line-height: 1.7; margin: 0; }
  footer { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 10px 20px 21px; }
  [data-error] { color: #900; padding: 0 20px; }
  [data-error]:empty { display: none; }
</style>
</head>
<body>
<div class="veil"></div>
<script>
  const count = __COUNT__;
  const remaining = __REMAINING__;
  const veil = document.querySelector(".veil");
  veil.innerHTML = Array.from({ length: count }, (_, index) => `
    <section class="window" style="transform:translate(${(index - (count - 1) / 2) * 28}px, ${(index - (count - 1) / 2) * 28}px)" role="dialog" aria-labelledby="work-title-${index}">
      <header><span class="title"><span class="app-icon" aria-hidden="true"></span>仕事しろ.exe - アプリケーション エラー</span><button class="close" data-close aria-label="閉じる">×</button></header>
      <main><span class="icon" aria-hidden="true"></span><div><h1 id="work-title-${index}">仕事しろ</h1><p>個人チャンネルを開いています。<br>仕事に戻りましょう。</p></div></main>
      <footer><button data-close>OK</button><button data-snooze ${remaining === 0 ? "disabled" : ""}>1分停止（残り${remaining}回）</button></footer>
      <p data-error role="status"></p>
    </section>`).join("");

  const dismiss = () => webkit.messageHandlers.dismiss.postMessage(null);
  document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => {
    button.closest(".window").remove();
    if (!document.querySelector(".window")) dismiss();
  }));
  document.querySelectorAll("[data-snooze]").forEach(button => button.addEventListener("click", async () => {
    const buttons = document.querySelectorAll("[data-snooze]");
    buttons.forEach(b => { b.disabled = true; });
    const error = await webkit.messageHandlers.snooze.postMessage(null);
    if (!error) return;
    document.querySelectorAll("[data-error]").forEach(element => { element.textContent = error; });
    buttons.forEach(b => { b.disabled = false; });
  }));
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") dismiss();
  });
</script>
</body>
</html>
