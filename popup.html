<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>仕事しろリマインダー</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="page-header">
    <span class="badge">Slack 集中サポート</span>
    <h1>仕事しろリマインダー</h1>
    <p>個人チャンネルの寄り道を、ほどほどに。</p>
  </header>
  <form id="settings">
    <label class="toggle-row card">
      <span><strong>リマインダー</strong><small>対象チャンネルで10秒おきに警告</small></span>
      <input id="enabled" class="switch" type="checkbox">
    </label>
    <section class="card">
    <h2>警告する時間帯</h2>
    <fieldset class="days">
      <legend>対象の曜日</legend>
      <label><input type="checkbox" name="day" value="1">月</label>
      <label><input type="checkbox" name="day" value="2">火</label>
      <label><input type="checkbox" name="day" value="3">水</label>
      <label><input type="checkbox" name="day" value="4">木</label>
      <label><input type="checkbox" name="day" value="5">金</label>
      <label><input type="checkbox" name="day" value="6">土</label>
      <label><input type="checkbox" name="day" value="0">日</label>
    </fieldset>
    <div class="times">
      <label>開始 <input id="start" type="time" required></label>
      <label>終了 <input id="end" type="time" required></label>
    </div>
    <p class="note">端末の現地時刻。開始と終了が同じなら終日。日をまたぐ場合は開始曜日が基準です。</p>
    </section>
    <section class="card">
      <label class="toggle-row">
        <span><strong>3分以上の滞在でも警告</strong><small>時間帯・曜日にかかわらず有効</small></span>
        <input id="three-minutes" class="switch" type="checkbox">
      </label>
      <p class="note">非アクティブ時も滞在を数えます。別チャンネルへ移るとリセットします。</p>
    </section>
    <section class="card">
      <h2><label for="exclusions">除外チャンネル</label></h2>
      <textarea id="exclusions" rows="4" placeholder="_example" spellcheck="false"></textarea>
      <p class="note">チャンネル名を1行に1件。除外したチャンネルは、時間帯・3分滞在の両方の警告対象外です。</p>
    </section>
    <div class="actions">
      <button id="save" type="submit" disabled>設定を保存</button>
      <button id="resume" type="button" disabled>一時停止を解除</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite">設定を読み込んでいます。</p>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
